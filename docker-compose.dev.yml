name: tele-velocity-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-1234}
      POSTGRES_DB: tele_velocity_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tele_velocity_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./Tele-Velocity Back
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tele_velocity_dev
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${DEV_DB_PASSWORD:-1234}
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 2s
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 1s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - maven_cache:/root/.m2
      - voice_uploads:/app/uploads
    develop:
      watch:
        - action: sync+exec
          path: ./Tele-Velocity Back/src/main
          target: /app/src/main
          initial_sync: true
          exec:
            command: ./mvnw -B -Pdevelopment -DskipTests compile
        - action: rebuild
          path: ./Tele-Velocity Back/pom.xml
  frontend:
    build:
      context: ./Tele-Velocity Front
      target: development
    depends_on:
      - backend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:3000:5173"
    volumes:
      - ./Tele-Velocity Front:/app
      - node_modules:/app/node_modules
volumes:
  postgres_data:
  voice_uploads:
  maven_cache:
  node_modules:
